<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- CRT Phosphor Green Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark CRT Screen with rounded corners -->
  <rect width="64" height="64" rx="14" fill="#020703" stroke="#00ff66" stroke-width="2.5" />

  <!-- Green Monospace 'g' with Phosphor Glow -->
  <text x="32" y="46" 
        font-family="'JetBrains Mono', 'Share Tech Mono', 'Courier New', -apple-system, sans-serif" 
        font-size="44" 
        font-weight="900" 
        fill="#39ff14" 
        text-anchor="middle" 
        filter="url(#glow)">g</text>
</svg>
